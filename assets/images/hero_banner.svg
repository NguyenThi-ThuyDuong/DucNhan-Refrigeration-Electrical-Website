<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 550" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f4f7f9" stop-opacity="0.90"/>
      <stop offset="70%" stop-color="#e2ebf2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c5d9e8" stop-opacity="0.60"/>
    </linearGradient>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a333d"/>
      <stop offset="100%" stop-color="#181e24"/>
    </linearGradient>

    <!-- LED Glow Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Grid Background -->
  <rect width="1600" height="550" fill="#f8fafc" />
  
  <!-- Right Industrial Cable & Electrical Panel Scene -->
  <g transform="translate(750, 0)">
    <!-- Dark Panel Metal Enclosure -->
    <rect x="150" y="20" width="660" height="510" rx="12" fill="url(#panel-bg)" stroke="#455463" stroke-width="4" />
    <rect x="170" y="40" width="620" height="470" rx="6" fill="#14191e" />

    <!-- Terminal Rail Row 1 -->
    <g transform="translate(200, 60)">
      <rect x="0" y="0" width="560" height="18" fill="#5a6978" />
      <!-- Circuit Breakers -->
      <g transform="translate(20, 18)">
        <!-- Breaker 1 -->
        <rect x="0" y="0" width="45" height="110" fill="#d0d7de" rx="3" stroke="#8c9ba5" />
        <rect x="10" y="20" width="25" height="40" fill="#e53935" rx="2" />
        <rect x="10" y="70" width="25" height="10" fill="#24292f" />
        <circle cx="22.5" cy="95" r="5" fill="#4ea05b" filter="url(#glow-green)" />
        
        <!-- Breaker 2 -->
        <rect x="55" y="0" width="45" height="110" fill="#d0d7de" rx="3" stroke="#8c9ba5" />
        <rect x="65" y="20" width="25" height="40" fill="#2196f3" rx="2" />
        <rect x="65" y="70" width="25" height="10" fill="#24292f" />
        <circle cx="77.5" cy="95" r="5" fill="#4ea05b" filter="url(#glow-green)" />

        <!-- Breaker 3 -->
        <rect x="110" y="0" width="45" height="110" fill="#d0d7de" rx="3" stroke="#8c9ba5" />
        <rect x="120" y="20" width="25" height="40" fill="#ffb300" rx="2" />
        <rect x="120" y="70" width="25" height="10" fill="#24292f" />
        <circle cx="132.5" cy="95" r="5" fill="#ffb300" filter="url(#glow-yellow)" />

        <!-- 3-Phase Industrial Switch -->
        <rect x="175" y="0" width="120" height="110" fill="#e6ebf0" rx="4" stroke="#a0acb5" />
        <rect x="190" y="15" width="90" height="50" fill="#0e5380" rx="4" />
        <text x="235" y="45" font-family="Arial" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">MAIN 380V</text>
        <circle cx="205" cy="85" r="7" fill="#4ea05b" filter="url(#glow-green)" />
        <circle cx="235" cy="85" r="7" fill="#4ea05b" filter="url(#glow-green)" />
        <circle cx="265" cy="85" r="7" fill="#e53935" filter="url(#glow-red)" />
      </g>
    </g>

    <!-- Control Indicator Lights Box -->
    <g transform="translate(560, 80)">
      <rect x="0" y="0" width="180" height="380" fill="#1e252d" rx="8" stroke="#374350" stroke-width="2" />
      <text x="90" y="30" font-family="Arial" font-weight="bold" font-size="13" fill="#8c9ba5" text-anchor="middle">STATUS MONITOR</text>
      
      <!-- Big Pilot Lights -->
      <circle cx="45" cy="80" r="18" fill="#e53935" filter="url(#glow-red)" />
      <text x="45" y="115" font-family="Arial" font-size="11" fill="#abb8c3" text-anchor="middle">PHASE A</text>

      <circle cx="135" cy="80" r="18" fill="#ffb300" filter="url(#glow-yellow)" />
      <text x="135" y="115" font-family="Arial" font-size="11" fill="#abb8c3" text-anchor="middle">PHASE B</text>

      <circle cx="45" cy="160" r="18" fill="#2196f3" filter="url(#glow-green)" />
      <text x="45" y="195" font-family="Arial" font-size="11" fill="#abb8c3" text-anchor="middle">PHASE C</text>

      <circle cx="135" cy="160" r="18" fill="#4ea05b" filter="url(#glow-green)" />
      <text x="135" y="195" font-family="Arial" font-size="11" fill="#abb8c3" text-anchor="middle">SYSTEM OK</text>

      <!-- Digital Volt/Amp Meter -->
      <rect x="20" y="220" width="140" height="60" fill="#000000" rx="4" stroke="#455463" />
      <text x="90" y="255" font-family="Courier New, monospace" font-weight="bold" font-size="24" fill="#00ff66" text-anchor="middle">384.5 V</text>
      <text x="90" y="272" font-family="Arial" font-size="10" fill="#8c9ba5" text-anchor="middle">FREQUENCY 50Hz</text>
    </g>

    <!-- Coiled Industrial Wires (Red, Yellow, Blue, Green, Black) -->
    <path d="M 220 200 C 180 260, 220 380, 160 480" fill="none" stroke="#e53935" stroke-width="12" stroke-linecap="round" />
    <path d="M 235 200 C 195 260, 235 380, 175 480" fill="none" stroke="#ffb300" stroke-width="12" stroke-linecap="round" />
    <path d="M 250 200 C 210 260, 250 380, 190 480" fill="none" stroke="#2196f3" stroke-width="12" stroke-linecap="round" />
    <path d="M 265 200 C 225 260, 265 380, 205 480" fill="none" stroke="#4ea05b" stroke-width="10" stroke-linecap="round" />
    <path d="M 330 200 C 370 280, 310 380, 390 480" fill="none" stroke="#e53935" stroke-width="14" stroke-linecap="round" />
    <path d="M 350 200 C 390 280, 330 380, 410 480" fill="none" stroke="#0e5380" stroke-width="14" stroke-linecap="round" />
    <path d="M 370 200 C 410 280, 350 380, 430 480" fill="none" stroke="#ffb300" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Left Gradient Overlay for Perfect Contrast -->
  <rect width="1050" height="550" fill="url(#hero-bg)" />
</svg>
